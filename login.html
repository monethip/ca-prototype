<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in — CA - Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #181d26;
        --primary-active: #0d1218;
        --ink: #181d26;
        --body: #333840;
        --muted: #41454d;
        --hairline: #dddddd;
        --canvas: #ffffff;
        --on-primary: #ffffff;
        --link: #1b61c9;
        --link-active: #1a3866;
        --info-border: #458fff;
        --font: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--canvas);
        color: var(--ink);
        font-family: var(--font);
        font-size: 14px;
        font-weight: 400;
        line-height: 1.25;
        display: flex;
        flex-direction: column;
      }
      a { color: var(--link); text-decoration: none; }
      a:active { color: var(--link-active); }
      nav.top-nav {
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 48px;
        background: var(--canvas);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--ink);
        font-size: 16px;
        font-weight: 500;
      }
      .mark {
        width: 22px;
        height: 22px;
        background: var(--ink);
        border-radius: 4px;
      }
      main {
        flex: 1;
        padding: 96px 24px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }
      .card { width: min(400px, 100%); }
      h1 {
        margin: 0 0 8px;
        font-size: 32px;
        font-weight: 400;
        line-height: 1.2;
      }
      .lede { margin: 0 0 32px; color: var(--body); }
      label {
        display: block;
        margin: 0 0 8px;
        font-size: 16px;
        font-weight: 500;
        line-height: 1.4;
      }
      .field { margin-bottom: 16px; }
      input {
        width: 100%;
        height: 44px;
        padding: 12px 16px;
        border: 1px solid var(--hairline);
        border-radius: 6px;
        background: var(--canvas);
        color: var(--ink);
        font-family: inherit;
        font-size: 14px;
      }
      input:focus { outline: none; border-color: var(--info-border); }
      .btn-primary {
        width: 100%;
        margin-top: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-family: inherit;
        font-size: 16px;
        font-weight: 500;
        line-height: 1.4;
        padding: 16px 24px;
        border: 0;
        border-radius: 12px;
        background: var(--primary);
        color: var(--on-primary);
        cursor: pointer;
        box-shadow: 0 1px 2px rgba(27, 97, 201, 0.18);
      }
      .btn-primary:active { background: var(--primary-active); }
      .btn-primary:focus-visible {
        outline: 2px solid var(--info-border);
        outline-offset: 2px;
      }
      .err { color: #aa2d00; margin: 0 0 16px; display: none; }
      .note { margin-top: 24px; color: var(--muted); }
      @media (max-width: 767px) {
        nav.top-nav { padding: 0 16px; }
      }
    </style>
  </head>
  <body>
    <nav class="top-nav">
      <a class="brand" href="login.html">
        <span class="mark" aria-hidden="true"></span>
        CA - Prototype
      </a>
    </nav>
    <main>
      <form class="card" id="loginForm">
        <h1>Log in</h1>
        <p class="lede">
          Log in to view certificates and extend validity.
        </p>
        <p class="err" id="err">Enter email and password to continue.</p>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button class="btn-primary" type="submit">Log in</button>
        <p class="note">Any email and password works in this prototype. A session token is issued after login.</p>
      </form>
    </main>
    <script>
      document.getElementById("loginForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var email = document.getElementById("email").value.trim();
        var password = document.getElementById("password").value;
        var err = document.getElementById("err");
        if (!email || !password) {
          err.style.display = "block";
          return;
        }
        var token = "snt_" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
        sessionStorage.setItem(
          "signet_session",
          JSON.stringify({
            email: email,
            token: token,
            issuedAt: new Date().toISOString(),
          })
        );
        window.location.href = "portal.html";
      });
    </script>
  </body>
</html>
